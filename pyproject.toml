[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "glyph-cli"
dynamic = ["version"]
description = "The dictionary and toolkit for the grid script, our transcription of what Ross 128 b sends (InterImm, The Contact Era)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "InterImm" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["conlang", "writing system", "knowledge graph", "science fiction", "interimm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Other Audience",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/InterImm/glyph-cli"
Documentation = "https://interimm.github.io/glyph-cli/"
Source = "https://github.com/InterImm/glyph-cli"
Issues = "https://github.com/InterImm/glyph-cli/issues"

[project.scripts]
glyph = "glyph_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["zensical"]

[tool.hatch.version]
path = "src/glyph_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/glyph_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "scripts/", "docs/", "zensical.toml", "README.md", "LICENSE"]
