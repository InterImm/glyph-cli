[project]
site_name = "glyph"
site_description = "The dictionary and toolkit for the grid script of Ross 128 b."
site_url = "https://interimm.github.io/glyph-cli/"
site_author = "InterImm"
copyright = "Copyright &copy; 2026 InterImm · MIT License"
repo_url = "https://github.com/InterImm/glyph-cli"
repo_name = "InterImm/glyph-cli"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "The script" = "script.md" },
  { "Page files" = "pages.md" },
  { "Vocabulary" = "vocabulary.md" },
  { "Command reference" = "cli.md" },
  { "Python API" = "python.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Instrument Sans"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/InterImm/glyph-cli"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
